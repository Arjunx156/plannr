name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing it runs can write to it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Fails on any known advisory of moderate severity or worse in the installed packages.
      - run: bun audit --audit-level=moderate
      - run: bun x biome ci .
      - run: bun x tsc -b
      - run: bun run coverage
      - run: bun x vite build
      - run: bun scripts/size-budget.ts
      - run: bun scripts/prerender.ts

  journeys:
    name: Browser journeys and accessibility
    # Playwright 1.56 supports Ubuntu up to 24.04; ubuntu-latest has moved past it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun x playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
