name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned to a commit, with its version beside it, so a moved tag can't change
# what runs. The workflow only reads the repository; nothing it runs can write to it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, structure, duplication, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Fails on any known advisory of moderate severity or worse in the installed packages.
      - run: bun audit --audit-level=moderate
      - run: bun x biome ci .
      - run: bun x tsc -b
      - run: bun scripts/structure.ts
      # Fails on any copied block of 5 lines and 50 tokens or more; settings in .jscpd.json.
      - run: bun x jscpd@4.3.0 src server scripts --silent
      - run: bun run coverage
      - run: bun x vite build
      - run: bun scripts/size-budget.ts
      - run: bun scripts/prerender.ts

  journeys:
    name: Browser journeys and accessibility
    # Playwright 1.56 supports Ubuntu up to 24.04; ubuntu-latest has moved past it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun x playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse on the public pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun x vite build
      # Accessibility, best practices and SEO must score 100 (lighthouserc.json). Performance only warns:
      # a preview server on a shared runner isn't the CDN families load Plannr from. Reports stay here as
      # an artifact; nothing is uploaded anywhere else.
      - run: bun x @lhci/cli@0.15.1 autorun
        env:
          PLANNR_DB: memory
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14

  secrets:
    name: No secrets in the history
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: New dependencies are free of known advisories
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
